name: Local web and API checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reproducible test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: API, permissions and delivered web integration
        run: npm test
      - name: Web and backend syntax
        run: npm run check:web
      - name: Native readiness report (separate from local web checks)
        run: npm run doctor:native
